# XcodeGen proje tanımı. Kullanım (macOS):
#   brew install xcodegen
#   cd ios && xcodegen generate && open MamaHaritasi.xcodeproj
name: MamaHaritasi
options:
  bundleIdPrefix: app.petmama
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  MamaKit:
    path: MamaKit
targets:
  MamaHaritasi:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - "Info.plist"
          - "*.entitlements"
    preBuildScripts:
      # Secrets.xcconfig yoksa uygulama sessizce demo moduna düşer (D7). Release'de bunu derlemede yakala.
      - name: Release yapılandırma kontrolü
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ] && [ "$MAMA_ALLOW_DEMO_RELEASE" != "YES" ]; then
            if [ -z "$MAMA_SUPABASE_URL" ] || [ -z "$MAMA_SUPABASE_ANON_KEY" ]; then
              echo "error: Release derlemesi gerçek backend ister: ios/App/Config/Secrets.xcconfig içinde MAMA_SUPABASE_URL ve MAMA_SUPABASE_ANON_KEY boş. (Bilerek demo Release için MAMA_ALLOW_DEMO_RELEASE=YES.)"
              exit 1
            fi
          fi
    configFiles:
      Debug: App/Config/Debug.xcconfig
      Release: App/Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.petmama.mamaharitasi
        PRODUCT_NAME: MamaHaritasi
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/MamaHaritasi.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: MamaKit
        product: AppFeature
schemes:
  MamaHaritasi:
    build:
      targets:
        MamaHaritasi: all
    run:
      config: Debug
    archive:
      config: Release
